Если говорить про реальные задачи DevOps/админа, то примерно 30–40 команд закрывают 90% работы с Docker. Остальное используется редко.
1. Информация о Docker
Версия
docker version
________________________________________
Информация о системе
docker info
________________________________________
2. Работа с образами
Скачать образ
docker pull nginx
________________________________________
Скачать конкретную версию
docker pull postgres:17
________________________________________
Посмотреть образы
docker images
или
docker image ls
________________________________________
Удалить образ
docker rmi nginx
________________________________________
Удалить несколько образов
docker rmi image1 image2
________________________________________
Собрать образ
docker build -t myapp .
________________________________________
Собрать образ с тегом
docker build -t myapp:v1 .
________________________________________
Изменить тег
docker tag myapp:v1 myrepo/myapp:v1
________________________________________
Загрузить образ в Registry
docker push myrepo/myapp:v1
________________________________________
3. Работа с контейнерами
Запустить контейнер
docker run nginx
________________________________________
Запустить в фоне
docker run -d nginx
________________________________________
Задать имя
docker run -d --name web nginx
________________________________________
Пробросить порт
docker run -d \
--name web \
-p 8080:80 \
nginx
________________________________________
Передать переменную окружения
docker run -e MYSQL_ROOT_PASSWORD=secret mysql
________________________________________
Подключить том
docker run \
-v pgdata:/var/lib/postgresql/data \
postgres
________________________________________
Автоперезапуск
docker run \
--restart unless-stopped \
nginx
________________________________________
Запустить интерактивно
docker run -it ubuntu bash
________________________________________
Список контейнеров
docker ps
________________________________________
Все контейнеры
docker ps -a
________________________________________
Остановить контейнер
docker stop web
________________________________________
Запустить остановленный
docker start web
________________________________________
Перезапустить
docker restart web
________________________________________
Удалить контейнер
docker rm web
________________________________________
Удалить работающий контейнер
docker rm -f web
________________________________________
4. Работа внутри контейнера
Выполнить команду
docker exec web ls /
________________________________________
Войти в контейнер
docker exec -it web bash
________________________________________
Если bash нет
docker exec -it web sh
________________________________________
Посмотреть процессы
docker top web
________________________________________
5. Логи
Просмотр логов
docker logs web
________________________________________
Смотреть в реальном времени
docker logs -f web
________________________________________
Последние 100 строк
docker logs --tail 100 web
________________________________________
6. Копирование файлов
Из контейнера
docker cp web:/etc/nginx/nginx.conf .
________________________________________
В контейнер
docker cp nginx.conf web:/etc/nginx/
________________________________________
7. Сети Docker
Список сетей
docker network ls
________________________________________
Создать сеть
docker network create app_net
________________________________________
Информация о сети
docker network inspect app_net
________________________________________
Подключить контейнер
docker network connect app_net web
________________________________________
Отключить контейнер
docker network disconnect app_net web
________________________________________
Удалить сеть
docker network rm app_net
________________________________________
8. Volumes
Список томов
docker volume ls
________________________________________
Создать том
docker volume create pgdata
________________________________________
Информация о томе
docker volume inspect pgdata
________________________________________
Удалить том
docker volume rm pgdata
________________________________________
9. Мониторинг
Использование ресурсов
docker stats
________________________________________
Только один контейнер
docker stats web
________________________________________
Информация о контейнере
docker inspect web
________________________________________
IP контейнера
docker inspect web | grep IPAddress
или
docker inspect -f \
'{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
web
________________________________________
10. Docker Compose
Запустить стек
docker compose up
________________________________________
В фоне
docker compose up -d
________________________________________
Пересобрать
docker compose up -d --build
________________________________________
Остановить
docker compose down
________________________________________
Остановить с удалением томов
docker compose down -v
________________________________________
Посмотреть контейнеры
docker compose ps
________________________________________
Логи
docker compose logs
________________________________________
Смотреть логи
docker compose logs -f
________________________________________
Перезапуск сервиса
docker compose restart nginx
________________________________________
Выполнить команду
docker compose exec nginx bash
________________________________________
11. Очистка Docker
Удалить остановленные контейнеры
docker container prune
________________________________________
Удалить неиспользуемые образы
docker image prune
________________________________________
Удалить всё неиспользуемое
docker system prune
________________________________________
Полная очистка
docker system prune -a
________________________________________
12. Отладка (каждый день)
Проверить контейнер
docker ps
________________________________________
Проверить логи
docker logs -f app
________________________________________
Войти внутрь
docker exec -it app bash
________________________________________
Проверить сеть
docker network inspect app_net
________________________________________
Проверить конфиг контейнера
docker inspect app
________________________________________
Команды, которые используются чаще всего
Запомни эти 15 в первую очередь:
docker ps
docker ps -a
docker images
docker pull
docker build
docker run
docker stop
docker start
docker restart
docker rm
docker logs -f
docker exec -it
docker inspect
docker compose up -d
docker compose down
Если уверенно владеешь этими командами, плюс понимаешь контейнеры, образы, сети, тома и Compose, то ты уже закрываешь подавляющее большинство повседневных задач с Docker.
эти команды выполняются в CLI?
Да. Практически все команды, которые я перечислил, выполняются в CLI (Command Line Interface) — обычном терминале Linux.
Примеры:
docker ps
docker images
docker logs -f nginx
docker compose up -d
docker exec -it nginx bash
________________________________________
Обычно схема работы DevOps выглядит так:
SSH → сервер → терминал → docker-команды
Например:
ssh maksim@192.168.12.104

docker ps
docker logs -f nginx
docker compose up -d
________________________________________
Есть и графические интерфейсы:
•	Docker Desktop 
•	Portainer 
•	Rancher 
Но в реальной работе админа/DevOps основным инструментом остаётся терминал.
________________________________________
На собеседовании обычно ожидают, что ты умеешь через CLI:
1.	Запустить контейнер. 
2.	Посмотреть логи. 
3.	Зайти внутрь контейнера. 
4.	Проверить сеть. 
5.	Подключить volume. 
6.	Собрать образ из Dockerfile. 
7.	Запустить стек через Compose. 
8.	Найти проблему по docker ps, docker logs, docker inspect. 
То есть примерно 95% практических задач решаются именно через терминал.

